<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CuraTrack Pro — Smart Health & Medication Suite</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf9',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom subtle scrollbar and print styles */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .smart-pulse {
      animation: smartPulse 2.4s ease-in-out infinite;
    }
    @keyframes smartPulse {
      0%, 100% { transform: translateY(0); opacity: 1; }
      50% { transform: translateY(-2px); opacity: .88; }
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #health-passport-card, #health-passport-card * {
        visibility: visible;
      }
      #health-passport-card {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-teal-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const Icon = ({ name, className = "w-5 h-5", ...props }) => {
      const icons = {
        pill: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="m8.5 8.5 7 7" />
          </svg>
        ),
        activity: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
        ),
        passport: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <circle cx="12" cy="10" r="3" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M7 21v-2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2" />
          </svg>
        ),
        hospital: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5m-4 0h4" />
          </svg>
        ),
        plus: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        ),
        check: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        ),
        trash: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
          </svg>
        ),
        phone: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" />
          </svg>
        ),
        clock: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <circle cx="12" cy="12" r="9" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        ),
        pin: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
          </svg>
        ),
        droplet: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
          </svg>
        ),
        shieldAlert: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.002A11.959 11.959 0 0 1 12 2.714ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>
        ),
        search: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        ),
        printer: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <polyline points="6 9 6 2 18 2 18 9" />
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
            <rect width="12" height="8" x="6" y="14" />
          </svg>
        ),
        spark: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="m12 3 1.35 5.65L19 10l-5.65 1.35L12 17l-1.35-5.65L5 10l5.65-1.35L12 3Z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="m19 16 .55 2.45L22 19l-2.45.55L19 22l-.55-2.45L16 19l2.45-.55L19 16Z" />
          </svg>
        ),
        shield: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 3 20 6v5c0 5-3.2 8.8-8 10-4.8-1.2-8-5-8-10V6l8-3Z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="m9 12 2 2 4-4" />
          </svg>
        ),
        clipboard: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <rect x="5" y="4" width="14" height="17" rx="2" />
            <path strokeLinecap="round" d="M9 4.5V3h6v1.5M8.5 10h7M8.5 14h7M8.5 18h4" />
          </svg>
        ),
        bell: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" />
          </svg>
        ),
        trend: (
          <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" {...props}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M3 17 9 11l4 4 8-8" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M15 7h6v6" />
          </svg>
        )
      };

      return icons[name] || null;
    };

    const INITIAL_MEDS = [
      { id: 1, name: "Metformin HCl", dosage: "500mg", time: "08:00 AM", taken: true, category: "Diabetes", instructions: "Take with food", streak: 12 },
      { id: 2, name: "Lisinopril", dosage: "10mg", time: "08:30 AM", taken: true, category: "Blood Pressure", instructions: "Take with water", streak: 19 },
      { id: 3, name: "Omega-3 Fish Oil", dosage: "1000mg", time: "01:00 PM", taken: false, category: "Supplement", instructions: "Take after lunch", streak: 5 },
      { id: 4, name: "Atorvastatin", dosage: "20mg", time: "09:30 PM", taken: false, category: "Cholesterol", instructions: "Take before sleep", streak: 14 }
    ];

    const INITIAL_VITALS = [
      { id: 1, type: "Blood Pressure", value: "122/78", unit: "mmHg", status: "Optimal", pulse: "72 bpm", date: "Today, 08:30 AM", trend: "stable" },
      { id: 2, type: "Fasting Glucose", value: "96", unit: "mg/dL", status: "Normal", pulse: "Pre-meal", date: "Today, 07:45 AM", trend: "down" },
      { id: 3, type: "Heart Rate", value: "68", unit: "BPM", status: "Resting", pulse: "Normal Rhythm", date: "Today, 10:15 AM", trend: "up" },
      { id: 4, type: "Blood Oxygen", value: "99", unit: "% SpO2", status: "Healthy", pulse: "Ambient Room Air", date: "Yesterday", trend: "stable" }
    ];

    const EMERGENCY_FACILITIES = [
      {
        id: "h1",
        type: "hospital",
        name: "Metro Health Academic Medical Center",
        address: "742 Evergreen Terrace, Medical District",
        distance: "1.2 km",
        timeEst: "4 mins",
        phone: "+1 (555) 234-5678",
        status: "Open 24/7",
        traumaLevel: "Level 1 Trauma",
        erWait: "14 mins"
      },
      {
        id: "h2",
        type: "hospital",
        name: "St. Jude Community Hospital & Urgent Care",
        address: "189 Grand River Blvd",
        distance: "2.8 km",
        timeEst: "9 mins",
        phone: "+1 (555) 890-1234",
        status: "Open 24/7",
        traumaLevel: "Level 2 Emergency",
        erWait: "22 mins"
      },
      {
        id: "b1",
        type: "bloodbank",
        name: "American Red Cross Regional Depot",
        address: "510 Health Science Parkway",
        distance: "1.9 km",
        timeEst: "6 mins",
        phone: "+1 (555) 345-9876",
        status: "Open until 8:00 PM",
        inventory: {
          "O+": "42 Units (High)",
          "O-": "8 Units (Critical Need)",
          "A+": "34 Units (Stable)",
          "B+": "27 Units (Stable)",
          "AB+": "19 Units (Good)"
        }
      },
      {
        id: "b2",
        type: "bloodbank",
        name: "Community LifeShare Donor Center",
        address: "99 Central Way, Suite 104",
        distance: "3.4 km",
        timeEst: "11 mins",
        phone: "+1 (555) 778-9900",
        status: "Open until 6:30 PM",
        inventory: {
          "O+": "25 Units (Stable)",
          "O-": "3 Units (Emergency Shortage)",
          "A+": "18 Units (Stable)",
          "B+": "12 Units (Low)"
        }
      },
      {
        id: "p1",
        type: "pharmacy",
        name: "CarePoint 24-Hour Drive-Thru Pharmacy",
        address: "410 North Oak Boulevard",
        distance: "0.8 km",
        timeEst: "3 mins",
        phone: "+1 (555) 667-2233",
        status: "24/7 Service",
        erWait: "Rx Ready in 15m"
      }
    ];

    const playSuccessChime = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {
        // AudioContext disabled or unsupported silently ignored
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [meds, setMeds] = useState(() => {
        const saved = localStorage.getItem("curatrack_meds");
        return saved ? JSON.parse(saved) : INITIAL_MEDS;
      });
      const [vitals, setVitals] = useState(() => {
        const saved = localStorage.getItem("curatrack_vitals");
        return saved ? JSON.parse(saved) : INITIAL_VITALS;
      });

      // Filter state for medications
      const [medFilter, setMedFilter] = useState("all");
      // Search & filter for locator
      const [locatorFilter, setLocatorFilter] = useState("all");
      const [locatorSearch, setLocatorSearch] = useState("");

      // Modal state for adding new medication
      const [isAddMedOpen, setIsAddMedOpen] = useState(false);
      // Modal state for logging vitals
      const [isLogVitalOpen, setIsLogVitalOpen] = useState(false);
      // In-app Toast message
      const [toast, setToast] = useState(null);

      // Smart Insights / Care Handoff feature state
      const [careMessage, setCareMessage] = useState("");
      const [smartMode, setSmartMode] = useState(true);

      useEffect(() => {
        localStorage.setItem("curatrack_meds", JSON.stringify(meds));
      }, [meds]);

      useEffect(() => {
        localStorage.setItem("curatrack_vitals", JSON.stringify(vitals));
      }, [vitals]);

      const triggerToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => {
          setToast(null);
        }, 3200);
      };

      const adherenceStats = useMemo(() => {
        const total = meds.length;
        const taken = meds.filter(m => m.taken).length;
        const percentage = total === 0 ? 0 : Math.round((taken / total) * 100);
        return { total, taken, percentage, pending: total - taken };
      }, [meds]);

      const toggleDose = (id) => {
        setMeds(prev => prev.map(m => {
          if (m.id === id) {
            const nextState = !m.taken;
            if (nextState) {
              playSuccessChime();
              triggerToast(`Marked ${m.name} as taken! Streak +1`);
            } else {
              triggerToast(`Marked ${m.name} as pending.`);
            }
            return {
              ...m,
              taken: nextState,
              streak: nextState ? (m.streak || 0) + 1 : Math.max(0, (m.streak || 1) - 1)
            };
          }
          return m;
        }));
      };

      const removeMedication = (id, name) => {
        setMeds(prev => prev.filter(m => m.id !== id));
        triggerToast(`Removed ${name} from regimen.`, "info");
      };

      const handleAddMed = (e) => {
        e.preventDefault();
        const form = e.target;
        const newMed = {
          id: Date.now(),
          name: form.name.value.trim(),
          dosage: form.dosage.value.trim(),
          time: form.time.value.trim(),
          category: form.category.value || "General",
          instructions: form.instructions.value.trim() || "Follow physician advice",
          taken: false,
          streak: 0
        };
        setMeds(prev => [newMed, ...prev]);
        setIsAddMedOpen(false);
        form.reset();
        triggerToast(`Added ${newMed.name} to routine.`);
      };

      const handleAddVital = (e) => {
        e.preventDefault();
        const form = e.target;
        const newVital = {
          id: Date.now(),
          type: form.type.value,
          value: form.value.value.trim(),
          unit: form.unit.value.trim(),
          status: form.status.value || "Normal",
          pulse: form.notes.value.trim() || "Routine Check",
          date: "Just now",
          trend: "stable"
        };
        setVitals(prev => [newVital, ...prev]);
        setIsLogVitalOpen(false);
        form.reset();
        triggerToast(`Vital metric logged successfully!`);
      };

      const filteredMeds = meds.filter(m => {
        if (medFilter === "taken") return m.taken;
        if (medFilter === "pending") return !m.taken;
        return true;
      });

      const filteredFacilities = EMERGENCY_FACILITIES.filter(item => {
        const matchesType = locatorFilter === "all" || item.type === locatorFilter;
        const matchesQuery = item.name.toLowerCase().includes(locatorSearch.toLowerCase()) ||
                             item.address.toLowerCase().includes(locatorSearch.toLowerCase());
        return matchesType && matchesQuery;
      });

      // --- INNOVATIVE FEATURE: Smart Health Command Center ---
      // These are simple local prototype heuristics, not clinical predictions.
      const readinessScore = useMemo(() => {
        const adherencePart = adherenceStats.percentage * 0.55;
        const stableVitals = vitals.filter(v =>
          ["Optimal", "Normal", "Healthy", "Resting"].includes(v.status)
        ).length;
        const vitalPart = (vitals.length ? (stableVitals / vitals.length) * 100 : 0) * 0.30;
        const pendingPenalty = Math.min(adherenceStats.pending * 5, 15);
        return Math.max(0, Math.min(100, Math.round(adherencePart + vitalPart + 15 - pendingPenalty)));
      }, [adherenceStats, vitals]);

      const refillRadar = useMemo(() => {
        const demoDays = { 1: 12, 2: 6, 3: 22, 4: 9 };
        return meds.map(m => ({
          ...m,
          daysLeft: demoDays[m.id] ?? 14,
          urgency: (demoDays[m.id] ?? 14) <= 7 ? "Refill soon" : "On track"
        }));
      }, [meds]);

      const smartActions = useMemo(() => {
        const actions = [];
        if (adherenceStats.pending > 0) {
          actions.push({
            icon: "bell",
            title: `${adherenceStats.pending} dose${adherenceStats.pending > 1 ? "s" : ""} still pending`,
            text: "Open the dashboard and record the dose when it is actually taken.",
            tone: "amber"
          });
        } else {
          actions.push({
            icon: "shield",
            title: "Daily dose checklist complete",
            text: "All scheduled demo doses are currently marked taken.",
            tone: "green"
          });
        }

        const refillSoon = refillRadar.filter(m => m.daysLeft <= 7);
        if (refillSoon.length) {
          actions.push({
            icon: "pill",
            title: `${refillSoon.length} medication${refillSoon.length > 1 ? "s" : ""} need refill planning`,
            text: refillSoon.map(m => `${m.name} (~${m.daysLeft} days)`).join(" • "),
            tone: "rose"
          });
        }

        actions.push({
          icon: "trend",
          title: "Keep your next vital reading consistent",
          text: "Record readings with the same context when possible so your history is easier to compare.",
          tone: "teal"
        });

        return actions;
      }, [adherenceStats, refillRadar]);

      const buildCareHandoff = () => {
        const pending = meds.filter(m => !m.taken).map(m => `${m.name} ${m.dosage} at ${m.time}`).join(", ") || "None";
        const latestVitals = vitals.slice(0, 4).map(v => `${v.type}: ${v.value} ${v.unit}`).join(" | ");
        const message =
          `CuraTrack Pro Care Handoff\n` +
          `Daily adherence: ${adherenceStats.percentage}% (${adherenceStats.taken}/${adherenceStats.total})\n` +
          `Pending doses: ${pending}\n` +
          `Recent vitals: ${latestVitals}\n` +
          `Readiness score (prototype heuristic): ${readinessScore}/100\n` +
          `Note: This summary is a prototype aid and does not replace professional medical advice.`;
        setCareMessage(message);
        navigator.clipboard?.writeText(message).then(
          () => triggerToast("Care handoff copied to clipboard."),
          () => triggerToast("Care handoff generated. Copy it from the box.", "info")
        );
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 selection:bg-teal-500 selection:text-white pb-12">
          
          {/* Top Medical Alert Bar */}
          <div className="bg-slate-900 text-slate-300 text-xs py-1.5 px-4 flex items-center justify-between border-b border-slate-800">
            <div className="flex items-center gap-2 max-w-6xl mx-auto w-full">
              <span className="inline-flex items-center gap-1 text-teal-400 font-semibold uppercase tracking-wider text-[10px]">
                <span className="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span> Live Patient Mode
              </span>
              <span className="text-slate-500">•</span>
              <span>Emergency Services Hotline: <strong>911 / 112</strong></span>
              <div className="ml-auto hidden sm:flex items-center gap-4 text-slate-400 text-[11px]">
                <span>Today: <strong>{new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</strong></span>
                <span className="bg-slate-800 px-2 py-0.5 rounded text-teal-300 font-mono">HIPAA Encrypted Local</span>
              </div>
            </div>
          </div>

          {/* Main Navigation Header */}
          <header className="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-sm transition">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3">

                      type="button"
                      onClick={() => setIsLogVitalOpen(false)}
                      className="px-4 py-2.5 rounded-xl font-bold text-slate-600 hover:bg-slate-100 transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 font-bold text-white transition shadow-sm shadow-teal-600/30"
                    >
                      Save Vital Reading
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer Information */}
          <footer className="mt-auto border-t border-slate-200 bg-white py-4 px-6 text-center text-xs text-slate-400">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <p>CuraTrack Pro &bull; HIPAA privacy standard compliant mock interface</p>
              <p className="text-slate-500 font-medium">In case of life-threatening events, always call emergency dispatch immediately.</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
